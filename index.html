<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <meta name="description" content="Metinlerinizi kolayca tekrarlayın, süsleyin ve kopyalayın.">
  <title>Text Repeater — Metin Tekrarlayıcı</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20243a;
      --muted: #788096;
      --line: #e8eaf2;
      --surface: #fff;
      --page: #f6f7fb;
      --primary: #6258e8;
      --primary-dark: #5146d5;
      --soft: #f0efff;
      --shadow: 0 18px 48px rgba(37, 43, 82, .09), 0 2px 8px rgba(37, 43, 82, .04);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(ellipse at 50% -15%, #eeedff 0, transparent 43%), var(--page);
    }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    .page { width: min(100% - 32px, 920px); margin: 0 auto; padding: 48px 0 40px; }
    header { position: relative; text-align: center; margin-bottom: 30px; }
    .language-switcher {
      position: absolute; right: 0; top: 0;
      width: 92px; height: 40px; padding: 0 30px 0 10px;
      color: #555b70; border: 1px solid var(--line); border-radius: 10px;
      background: #fff; font-size: 12px; font-weight: 700;
    }
    .brand-mark {
      display: inline-grid; place-items: center; width: 52px; height: 52px; margin-bottom: 14px;
      border-radius: 17px; color: white; font-size: 25px;
      background: linear-gradient(140deg, #8279ff, #5d50dd); box-shadow: 0 9px 22px #6258e842;
    }
    h1 { margin: 0; font-size: clamp(27px, 5vw, 37px); letter-spacing: -.045em; }
    header p { margin: 9px 0 0; color: var(--muted); font-size: 15px; }
    .app {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px;
      padding: 22px; border: 1px solid rgba(255,255,255,.9); border-radius: 24px;
      background: rgba(255,255,255,.92); box-shadow: var(--shadow);
    }
    .panel { min-width: 0; }
    .field { margin-bottom: 20px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 9px; }
    label, .field-title { color: #33384f; font-size: 13px; font-weight: 700; }
    .hint { color: var(--muted); font-size: 12px; font-weight: 500; }
    textarea, input[type="number"], input[type="text"], select {
      width: 100%; color: var(--ink); border: 1px solid var(--line); border-radius: 12px;
      background: #fff; outline: none; transition: border-color .16s, box-shadow .16s;
    }
    textarea { display: block; min-height: 142px; padding: 13px 14px; resize: vertical; line-height: 1.55; }
    textarea::placeholder, input::placeholder { color: #a7adbd; }
    textarea:focus, input:focus, select:focus { border-color: #928bff; box-shadow: 0 0 0 3px #6258e81b; }
    .inline { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    input[type="number"], input[type="text"] { height: 44px; padding: 0 12px; }
    .number-wrap { position: relative; }
    .number-wrap input { padding-right: 58px; }
    .number-wrap .max { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #9aa0b1; font-size: 11px; pointer-events: none; }
    .custom-separator { display: none; margin-top: 10px; }
    .custom-separator.visible { display: block; }
    .decorations { padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #fcfcfe; }
    .decorations .field-title { display: block; margin-bottom: 12px; }
    .icon-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .icon-group > span { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 650; }
    .icon-list { display: flex; flex-wrap: wrap; gap: 5px; }
    .icon-btn {
      display: grid; place-items: center; min-width: 33px; height: 32px; padding: 0 6px;
      border: 1px solid var(--line); border-radius: 9px; background: #fff; font-size: 16px;
      transition: .15s ease;
    }
    .icon-btn:hover { border-color: #bcb7ff; background: var(--soft); transform: translateY(-1px); }
    .icon-btn:active { transform: scale(.96); }
    .checks { display: flex; flex-wrap: wrap; gap: 12px 18px; margin-top: 14px; }
    .check { display: inline-flex; align-items: center; gap: 7px; color: #555b70; font-size: 12px; font-weight: 550; cursor: pointer; }
    .check input { width: 15px; height: 15px; margin: 0; accent-color: var(--primary); }
    .actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 45px;
      padding: 0 16px; border: 0; border-radius: 12px; font-size: 13px; font-weight: 700;
      transition: transform .15s, background .15s, box-shadow .15s;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }
    .btn-primary { flex: 1; color: #fff; background: var(--primary); box-shadow: 0 6px 14px #6258e82e; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-quiet { color: #646a7d; border: 1px solid var(--line); background: white; }
    .btn-quiet:hover { background: #f8f8fc; }
    .output-head { display: flex; justify-content: space-between; align-items: center; margin: 1px 0 9px; }
    .output-title { font-size: 13px; font-weight: 700; }
    .copy-btn { min-height: 34px; padding: 0 11px; color: var(--primary); border: 1px solid #e1dfff; border-radius: 9px; background: var(--soft); font-size: 12px; font-weight: 700; }
    .copy-btn:hover { background: #e8e6ff; }
    #output { min-height: 321px; height: 321px; background: #fbfbfd; font-size: 13px; }
    .stats { display: flex; gap: 8px; margin-top: 11px; }
    .stat { flex: 1; padding: 10px 12px; border-radius: 11px; background: #f7f7fc; }
    .stat strong { display: block; font-size: 16px; letter-spacing: -.02em; }
    .stat span { color: var(--muted); font-size: 11px; }
    .toast {
      position: fixed; left: 50%; bottom: 25px; z-index: 3; padding: 11px 17px;
      color: #fff; border-radius: 11px; background: #272b40; box-shadow: 0 8px 25px #20243a38;
      font-size: 13px; font-weight: 650; opacity: 0; transform: translate(-50%, 10px); pointer-events: none;
      transition: .2s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    footer { padding-top: 18px; color: #9399a9; text-align: center; font-size: 12px; }
    @media (max-width: 680px) {
      .page { width: min(100% - 22px, 520px); padding-top: 72px; }
      header { margin-bottom: 22px; }
      .language-switcher { position: absolute; right: 0; top: -55px; }
      .app { grid-template-columns: 1fr; gap: 25px; padding: 16px; border-radius: 19px; }
      #output { min-height: 230px; height: 230px; }
      .field { margin-bottom: 17px; }
    }
    @media (max-width: 390px) {
      .inline { grid-template-columns: 1fr; gap: 13px; }
      .icon-controls { gap: 8px; }
      .actions .btn { padding: 0 11px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <select id="languageSwitcher" class="language-switcher" aria-label="Dil seçimi">
        <option value="tr">TR</option>
        <option value="en">EN</option>
        <option value="ru">RU</option>
      </select>
      <div class="brand-mark" aria-hidden="true">↻</div>
      <h1 data-i18n="title">Text Repeater</h1>
      <p data-i18n="subtitle">Metnini yaz, tekrar sayısını belirle — gerisini biz halledelim.</p>
    </header>

    <section class="app" aria-label="Metin tekrarlayıcı">
      <div class="panel">
        <div class="field">
          <div class="label-row"><label for="source" data-i18n="sourceLabel">Metniniz</label><span class="hint" data-i18n="sourceHint">Tekrarlanacak metni yazın</span></div>
          <textarea id="source" placeholder="Örnek: Merhaba dünya!" spellcheck="false"></textarea>
        </div>

        <div class="field inline">
          <div>
            <div class="label-row"><label for="repeatCount" data-i18n="repeatLabel">Tekrar sayısı</label></div>
            <div class="number-wrap">
              <input id="repeatCount" type="number" value="5" min="1" max="10000" inputmode="numeric" aria-describedby="countHint">
              <span class="max">/ 10.000</span>
            </div>
          </div>
          <div>
            <div class="label-row"><label for="separator" data-i18n="separatorLabel">Ayırıcı</label></div>
            <select id="separator">
              <option value="newline" data-i18n="newline">Yeni satır</option>
              <option value="space" data-i18n="space">Boşluk</option>
              <option value="comma" data-i18n="comma">Virgül</option>
              <option value="custom" data-i18n="custom">Özel ayırıcı</option>
            </select>
            <div id="customWrap" class="custom-separator"><input id="customSeparator" type="text" placeholder="Ayırıcıyı yazın" aria-label="Özel ayırıcı"></div>
          </div>
        </div>

        <div class="decorations">
          <span class="field-title" data-i18n="addIcon">Metne simge ekle</span>
          <div class="icon-controls">
            <div class="icon-group"><span data-i18n="prefix">Başına ekle</span><div class="icon-list" data-target="prefix" aria-label="Metnin başına simge ekle"></div></div>
            <div class="icon-group"><span data-i18n="suffix">Sonuna ekle</span><div class="icon-list" data-target="suffix" aria-label="Metnin sonuna simge ekle"></div></div>
          </div>
          <div class="checks">
            <label class="check"><input id="numbered" type="checkbox"><span data-i18n="numbered"> Sıralı numara ekle</span></label>
            <label class="check"><input id="reverse" type="checkbox"><span data-i18n="reverse"> Metni ters çevir</span></label>
          </div>
        </div>

        <div class="actions">
          <button id="generate" class="btn btn-primary" type="button"><span aria-hidden="true">✦</span> <span data-i18n="generate">Metni oluştur</span></button>
          <button id="clear" class="btn btn-quiet" type="button"><span aria-hidden="true">⌫</span> <span data-i18n="clear">Temizle</span></button>
        </div>
      </div>

      <div class="panel">
        <div class="output-head">
          <label class="output-title" for="output" data-i18n="result">Sonuç</label>
          <button id="copy" class="copy-btn" type="button"><span aria-hidden="true">▢</span> <span data-i18n="copy">Kopyala</span></button>
        </div>
        <textarea id="output" readonly placeholder="Oluşturduğunuz metin burada görünecek..." aria-live="polite"></textarea>
        <div class="stats" aria-label="Metin istatistikleri">
          <div class="stat"><strong id="charCount">0</strong><span data-i18n="characters">Karakter</span></div>
          <div class="stat"><strong id="wordCount">0</strong><span data-i18n="words">Kelime</span></div>
        </div>
      </div>
    </section>
    <footer>
      <span data-i18n="footer">Ücretsiz, hızlı ve tamamen tarayıcınızda çalışır.</span><br>
      Made by ObsideX Studio
    </footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (() => {
      const translations = {
        tr: { title:'Text Repeater', subtitle:'Metnini yaz, tekrar sayısını belirle — gerisini biz halledelim.', appLabel:'Metin tekrarlayıcı', sourceLabel:'Metniniz', sourceHint:'Tekrarlanacak metni yazın', sourcePlaceholder:'Örnek: Merhaba dünya!', repeatLabel:'Tekrar sayısı', separatorLabel:'Ayırıcı', newline:'Yeni satır', space:'Boşluk', comma:'Virgül', custom:'Özel ayırıcı', customPlaceholder:'Ayırıcıyı yazın', addIcon:'Metne simge ekle', prefix:'Başına ekle', suffix:'Sonuna ekle', numbered:'Sıralı numara ekle', reverse:'Metni ters çevir', generate:'Metni oluştur', clear:'Temizle', result:'Sonuç', copy:'Kopyala', outputPlaceholder:'Oluşturduğunuz metin burada görünecek...', characters:'Karakter', words:'Kelime', footer:'Ücretsiz, hızlı ve tamamen tarayıcınızda çalışır.', noText:'Önce bir metin oluşturun.', copied:'Kopyalandı!', iconPrefix:'başına', iconSuffix:'sonuna', iconAdd:'ekle', statsLabel:'Metin istatistikleri', pageTitle:'Text Repeater — Metin Tekrarlayıcı', description:'Metinlerinizi kolayca tekrarlayın, süsleyin ve kopyalayın.' },
        en: { title:'Text Repeater', subtitle:'Write your text, choose the repeat count — we’ll handle the rest.', appLabel:'Text repeater', sourceLabel:'Your text', sourceHint:'Enter the text to repeat', sourcePlaceholder:'Example: Hello world!', repeatLabel:'Repeat count', separatorLabel:'Separator', newline:'New line', space:'Space', comma:'Comma', custom:'Custom separator', customPlaceholder:'Enter separator', addIcon:'Add an icon', prefix:'Add before', suffix:'Add after', numbered:'Add sequential numbers', reverse:'Reverse text', generate:'Generate text', clear:'Clear', result:'Result', copy:'Copy', outputPlaceholder:'Your generated text will appear here...', characters:'Characters', words:'Words', footer:'Free, fast, and runs entirely in your browser.', noText:'Generate text first.', copied:'Copied!', iconPrefix:'before', iconSuffix:'after', iconAdd:'Add', statsLabel:'Text statistics', pageTitle:'Text Repeater', description:'Repeat, decorate, and copy text easily.' },
        ru: { title:'Повторитель текста', subtitle:'Введите текст и выберите количество повторов — остальное сделаем мы.', appLabel:'Повторитель текста', sourceLabel:'Ваш текст', sourceHint:'Введите текст для повторения', sourcePlaceholder:'Пример: Привет, мир!', repeatLabel:'Количество повторов', separatorLabel:'Разделитель', newline:'Новая строка', space:'Пробел', comma:'Запятая', custom:'Свой разделитель', customPlaceholder:'Введите разделитель', addIcon:'Добавить значок', prefix:'В начало', suffix:'В конец', numbered:'Добавить нумерацию', reverse:'Перевернуть текст', generate:'Создать текст', clear:'Очистить', result:'Результат', copy:'Копировать', outputPlaceholder:'Сгенерированный текст появится здесь...', characters:'Символы', words:'Слова', footer:'Бесплатно, быстро и полностью в вашем браузере.', noText:'Сначала создайте текст.', copied:'Скопировано!', iconPrefix:'в начало', iconSuffix:'в конец', iconAdd:'добавить', statsLabel:'Статистика текста', pageTitle:'Повторитель текста', description:'Легко повторяйте, оформляйте и копируйте текст.' }
      };

      const icons = ['✨', '🔥', '👑', '★', '⚡'];
      const selected = { prefix: '', suffix: '' };
      const source = document.querySelector('#source');
      const output = document.querySelector('#output');
      const count = document.querySelector('#repeatCount');
      const separator = document.querySelector('#separator');
      const customWrap = document.querySelector('#customWrap');
      const customSeparator = document.querySelector('#customSeparator');
      const numbered = document.querySelector('#numbered');
      const reverse = document.querySelector('#reverse');
      const charCount = document.querySelector('#charCount');
      const wordCount = document.querySelector('#wordCount');
      const toast = document.querySelector('#toast');
      const languageSwitcher = document.querySelector('#languageSwitcher');
      let currentLanguage = 'tr';
      let toastTimer;

      function applyLanguage(language) {
        const t = translations[language];
        currentLanguage = language;
        document.documentElement.lang = language;
        document.title = t.pageTitle;
        document.querySelector('meta[name="description"]').content = t.description;
        document.querySelectorAll('[data-i18n]').forEach(element => {
          const key = element.dataset.i18n;
          if (t[key]) element.textContent = t[key];
        });
        source.placeholder = t.sourcePlaceholder;
        output.placeholder = t.outputPlaceholder;
        customSeparator.placeholder = t.customPlaceholder;
        customSeparator.setAttribute('aria-label', t.custom);
        document.querySelector('.app').setAttribute('aria-label', t.appLabel);
        document.querySelector('.stats').setAttribute('aria-label', t.statsLabel);
        document.querySelectorAll('.icon-list').forEach(group => {
          group.setAttribute('aria-label', group.dataset.target === 'prefix' ? t.prefix : t.suffix);
        });
        document.querySelectorAll('.icon-btn').forEach(button => {
          const target = button.closest('.icon-list').dataset.target;
          button.title = `${button.textContent} ${target === 'prefix' ? t.iconPrefix : t.iconSuffix} ${t.iconAdd}`;
          button.setAttribute('aria-label', button.title);
        });
        languageSwitcher.value = language;
        localStorage.setItem('textRepeaterLanguage', language);
        updateStats(output.value);
      }

      document.querySelectorAll('.icon-list').forEach(group => {
        const target = group.dataset.target;
        icons.forEach(icon => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'icon-btn';
          button.textContent = icon;
          button.title = `${icon} ${target === 'prefix' ? translations[currentLanguage].iconPrefix : translations[currentLanguage].iconSuffix} ${translations[currentLanguage].iconAdd}`;
          button.setAttribute('aria-label', button.title);
          button.addEventListener('click', () => {
            selected[target] += icon;
            button.setAttribute('aria-pressed', 'true');
            button.style.borderColor = '#928bff';
            button.style.background = '#f0efff';
            generate();
          });
          group.append(button);
        });
      });

      function getSeparator() {
        switch (separator.value) {
          case 'space': return ' ';
          case 'comma': return ', ';
          case 'custom': return customSeparator.value;
          default: return '\n';
        }
      }

      function generate() {
        const rawCount = Number.parseInt(count.value, 10);
        const repeatCount = Number.isFinite(rawCount) ? Math.min(10000, Math.max(1, rawCount)) : 1;
        count.value = repeatCount;
        const text = source.value;
        if (!text) {
          output.value = '';
          updateStats('');
          return;
        }
        const repeated = Array.from({ length: repeatCount }, (_, index) => {
          let value = reverse.checked ? Array.from(text).reverse().join('') : text;
          value = selected.prefix + value + selected.suffix;
          return numbered.checked ? `${index + 1}. ${value}` : value;
        });
        const result = repeated.join(getSeparator());
        output.value = result;
        updateStats(result);
      }

      function updateStats(text) {
        const locale = currentLanguage === 'tr' ? 'tr-TR' : currentLanguage === 'ru' ? 'ru-RU' : 'en-US';
        charCount.textContent = Array.from(text).length.toLocaleString(locale);
        const words = text.trim() ? text.trim().split(/\s+/u).length : 0;
        wordCount.textContent = words.toLocaleString(locale);
      }

      function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 1900);
      }

      languageSwitcher.addEventListener('change', () => applyLanguage(languageSwitcher.value));
      document.querySelector('#generate').addEventListener('click', generate);
      [source, count, separator, customSeparator, numbered, reverse].forEach(element => {
        element.addEventListener('input', generate);
        element.addEventListener('change', generate);
      });
      separator.addEventListener('change', () => {
        customWrap.classList.toggle('visible', separator.value === 'custom');
      });
      document.querySelector('#clear').addEventListener('click', () => {
        source.value = '';
        count.value = 5;
        separator.value = 'newline';
        customSeparator.value = '';
        customWrap.classList.remove('visible');
        numbered.checked = false;
        reverse.checked = false;
        selected.prefix = '';
        selected.suffix = '';
        document.querySelectorAll('.icon-btn').forEach(button => {
          button.removeAttribute('aria-pressed');
          button.style.borderColor = '';
          button.style.background = '';
        });
        generate();
        source.focus();
      });
      document.querySelector('#copy').addEventListener('click', async () => {
        if (!output.value) { showToast(translations[currentLanguage].noText); return; }
        try {
          await navigator.clipboard.writeText(output.value);
        } catch {
          output.focus();
          output.select();
          document.execCommand('copy');
          output.setSelectionRange(0, 0);
        }
        showToast(translations[currentLanguage].copied);
      });

      const savedLanguage = localStorage.getItem('textRepeaterLanguage');
      const browserLanguage = navigator.language.toLowerCase().startsWith('ru') ? 'ru' : navigator.language.toLowerCase().startsWith('tr') ? 'tr' : 'en';
      applyLanguage(savedLanguage && translations[savedLanguage] ? savedLanguage : browserLanguage);
    })();
  </script>
</body>
</html>
